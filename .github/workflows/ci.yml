name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Generate smoke dataset
        env:
          PYTHONPATH: src
        run: python -m sodlab.cli generate --output data/synthetic

      - name: Validate smoke dataset
        env:
          PYTHONPATH: src
        run: python -m sodlab.cli validate --data data/synthetic/data.yaml

